<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membuka halaman tender...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f0f4f8;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      max-width: 400px;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h2 { color: #1a202c; margin-bottom: 8px; }
    p { color: #718096; margin-bottom: 24px; }
    .bar-wrap {
      background: #e2e8f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      border-radius: 99px;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🏗️</div>
    <h2>Adhitama SPSE</h2>
    <p>Sedang membuka halaman tender, harap tunggu...</p>
    <div class="bar-wrap">
      <div class="bar" id="bar"></div>
    </div>
  </div>

  <script>
    // Ambil parameter dari URL
    const params = new URLSearchParams(window.location.search);
    const lpse = params.get('lpse');
    const id = params.get('id');
    const type = params.get('type') || 'lelang';

    // Bangun URL tujuan
    const base = 'https://spse.inaproc.id';
    const targetUrl = `${base}/${lpse}/${type}/${id}/pengumuman${type}`;
    const refererUrl = `${base}/${lpse}/${type}`;

    // Animasi loading bar
    let pct = 0;
    const bar = document.getElementById('bar');
    const interval = setInterval(() => {
      pct += 2;
      bar.style.width = pct + '%';
      if (pct >= 100) {
        clearInterval(interval);
        // Buka halaman tujuan
        window.location.replace(targetUrl);
      }
    }, 40);
  </script>
</body>
</html>
